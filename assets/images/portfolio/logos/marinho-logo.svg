<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Glowing subtle backing -->
  <defs>
    <linearGradient id="marinhoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="marinhoBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Tooth Emblem Inside Rounded Glass Box -->
  <rect x="8" y="10" width="60" height="60" rx="14" fill="#0C1322" stroke="url(#marinhoGlow)" stroke-width="1.5" />
  
  <!-- Stylized Tooth Path -->
  <path d="M28 26C28 21.5 32 19 38 19C41.5 19 43.5 21 48 21C52.5 21 54.5 19 58 19C64 19 68 21.5 68 26C68 31 66 35 64 41C61.5 48.5 59 61 54.5 61C52 61 50.5 53 48 53C45.5 53 44 61 41.5 61C37 61 34.5 48.5 32 41C30 35 28 31 28 26Z" 
        fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Dental Sparkle / Smile Accent -->
  <circle cx="48" cy="33" r="2" fill="#FFFFFF" filter="url(#marinhoBlur)"/>

  <!-- Brand Typography -->
  <text x="82" y="38" font-family="'Mona Sans', 'Montserrat', 'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">MARINHO</text>
  <text x="194" y="38" font-family="'Mona Sans', 'Montserrat', 'Inter', sans-serif" font-size="20" font-weight="300" letter-spacing="1.5" fill="#38BDF8">ODONTO</text>
  <text x="83" y="55" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="3" fill="rgba(248, 248, 252, 0.5)">ESTÉTICA &amp; TECNOLOGIA 3D</text>
</svg>
